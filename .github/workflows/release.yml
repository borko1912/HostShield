name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version matches the tag
        run: grep -q "SHIELD_VERSION = '${GITHUB_REF_NAME#v}'" lib/core.php
      - name: Build zip
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=hostshield/ -o "dist/hostshield-${GITHUB_REF_NAME}.zip" HEAD
          cd dist && sha256sum *.zip > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## ${GITHUB_REF_NAME#v}/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "HostShield ${GITHUB_REF_NAME#v}" --notes "$notes"
